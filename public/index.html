<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Miami to Honduras | Receiving and tracking</title>
  <meta name="description" content="A working preview of the Miami receiving desk, customer package tracking, labels, collections and first freight quotes.">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#app">Skip to workspace</a>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">M</span><strong id="company-name">Miami ↔ Honduras Freight</strong></a>
    <nav hidden aria-label="Staff navigation"><button class="nav-link" data-view="receiving">Receiving desk</button><button class="nav-link" data-view="setup">Demo setup</button></nav>
    <button id="logout" class="btn btn-secondary" data-action="logout">Sign out</button>
  </header>
  <main id="app" class="main"><div class="loading-state">Loading accounts…</div></main>
  <dialog id="delivery-editor" aria-labelledby="delivery-title">
    <form id="delivery-form">
      <div class="dialog-head"><h2 id="delivery-title">Honduras delivery address</h2><button class="text-button" type="button" data-action="close-dialog">Cancel</button></div>
      <p id="delivery-account"></p>
      <div class="field"><label for="delivery-address">Street or colonia, city and department</label><textarea id="delivery-address" name="deliveryAddress" rows="4" maxlength="600" required></textarea><small>Include the house number or a nearby landmark.</small></div>
      <p class="form-error" role="alert"></p><div class="form-actions"><button class="btn btn-primary" type="submit">Save address</button></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status"></div>
  <script src="/vendor/jsQR.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
