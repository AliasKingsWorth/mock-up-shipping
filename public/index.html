<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Miami to Honduras | Receiving and tracking</title>
  <meta name="description" content="A working preview of the Miami receiving desk, customer package tracking, labels, collections and first freight quotes.">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#app">Skip to workspace</a>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">M</span><strong id="company-name">Miami ↔ Honduras Freight</strong></a>
    <div class="staff-location" hidden>Staff workspace</div>
    <nav hidden aria-label="Staff navigation">
      <button class="nav-link" data-view="receiving"><span class="rail-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/></svg></span>Receiving desk</button>
      <button class="nav-link" data-view="intake"><span class="rail-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 7v10M7 12h10"/></svg></span>Package intake</button>
      <button class="nav-link" data-view="collections"><span class="rail-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 6h11v11H3zM14 10h4l3 4v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg></span>Collections</button>
      <button class="nav-link" data-view="setup"><span class="rail-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 7h6m4 0h8M3 17h10m4 0h4"/><circle cx="11" cy="7" r="2"/><circle cx="15" cy="17" r="2"/></svg></span>Demo setup</button>
    </nav>
    <button id="logout" class="btn btn-secondary" data-action="logout">Sign out</button>
  </header>
  <main id="app" class="main"><div class="loading-state">Loading accounts…</div></main>
  <dialog id="staff-record" aria-label="Package record">
    <div class="dialog-head"><h2>Package record</h2><button class="text-button" type="button" data-action="close-dialog">Close</button></div>
    <div id="staff-record-body"></div>
  </dialog>
  <dialog id="delivery-editor" aria-labelledby="delivery-title">
    <form id="delivery-form">
      <div class="dialog-head"><h2 id="delivery-title">Honduras delivery address</h2><button class="text-button" type="button" data-action="close-dialog">Cancel</button></div>
      <p id="delivery-account"></p>
      <div class="field"><label for="delivery-address">Street or colonia, city and department</label><textarea id="delivery-address" name="deliveryAddress" rows="4" maxlength="600" required></textarea><small>Include the house number or a nearby landmark.</small></div>
      <p class="form-error" role="alert"></p><div class="form-actions"><button class="btn btn-primary" type="submit">Save address</button></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status"></div>
  <script src="/vendor/jsQR.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
